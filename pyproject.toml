[project]
name = "mcp-auditguard"
version = "0.1.0"
description = "MCP Tool Poisoning detection and tool metadata integrity scanner"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "fastapi",
    "jinja2>=3.1",
    "uvicorn[standard]",
    "python-multipart",
    "mcp>=1.27,<2",
    "httpx>=0.27.1,<1.0.0",
]

[project.scripts]
auditguard = "cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
semantic = [
    "sentence-transformers>=3.0",
]
build = [
    "pyinstaller>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "cli*",
    "core*",
    "detectors*",
    "reports*",
    "web*",
    "rules*",
]
exclude = [
    "tests*",
    "docs*",
    "vulnerable-lab*",
]
namespaces = true

[tool.setuptools.package-data]
rules = ["*.yaml"]
web = ["templates/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
