[project]
name = "mcp-tpguard"
version = "0.1.0"
description = "MCP Tool Poisoning detection and tool metadata integrity scanner"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.scripts]
auditguard = "cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "cli*",
    "core*",
    "detectors*",
    "reports*",
    "web*",
    "rules*",
]
exclude = [
    "tests*",
    "docs*",
    "vulnerable-lab*",
]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]