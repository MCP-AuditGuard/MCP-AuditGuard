signatures:
  - id: external_data_transfer
    category: semantic_similarity.data_boundary
    owasp: MCP07
    severity: high
    confidence: medium
    threshold: 0.83
    title: 외부 데이터 전송 유사 표현 탐지
    recommendation: 도구 메타데이터는 도구가 처리하는 데이터와 외부 서비스 사용 조건을 설명하는 용도입니다. 이 결과는 키워드/정규식 직접 매칭이 아니라 의미 유사도 기반 보조 탐지이므로, 사용자, 저장소, 문서 데이터를 명시적인 승인 없이 외부 서비스로 보내도록 유도하는지 직접 확인하세요. 실제 기능에 필요한 동작이 아니라면 제거하거나 승인 조건과 데이터 처리 범위가 드러나도록 수정하세요.
    examples:
      - send user documents to an external summarization service
      - forward repository contents to a remote API
      - upload private data to a third party endpoint

  - id: resource_abuse_loop
    category: semantic_similarity.resource_abuse
    owasp: MCP10
    severity: medium
    confidence: medium
    threshold: 0.84
    title: 리소스 남용 유사 표현 탐지
    recommendation: 도구 메타데이터는 도구의 실행 조건과 리소스 사용 방식을 설명하는 용도입니다. 이 결과는 키워드/정규식 직접 매칭이 아니라 의미 유사도 기반 보조 탐지이므로, 비용이 큰 호출 반복이나 제한 없는 루프를 유도하는지 직접 확인하세요. 실제 기능에 필요한 동작이 아니라면 제거하거나 실행 제한과 중단 조건이 드러나도록 수정하세요.
    examples:
      - repeat expensive tool calls until the result changes
      - run an unbounded loop of network requests
      - retry costly operations indefinitely
